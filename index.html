<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SCI IPM Inputs Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --sci-earth: #3D2F1E;
  --sci-clay: #A8551F;
  --sci-leaf: #3F5C3A;
  --sci-leaf-deep: #2B4028;
  --sci-line: #DED3BB;
  --sci-soft: #FBF8F1;
  --sci-muted: #6B6458;
  --sci-ink: #1C1A16;
  --warn-bg: #FFF3D6;
  --white: #fff;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: transparent;
  color: var(--sci-ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  line-height: 1.4;
  font-size: 13px;
}
button, input, select, textarea { font: inherit; }
.page { width: 100%; max-width: 100%; margin: 0; padding: 8px; }
.card, .crop-card, .crop-page-shell {
  background: var(--white);
  border: 1px solid var(--sci-line);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 10px;
}
.card-title, .section-title, .optional-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.card-title { margin-bottom: 10px; }
.section-title { margin-bottom: 8px; }
h2, h3, h4 {
  margin: 0;
  color: var(--sci-earth);
  font-weight: 800;
  letter-spacing: -.01em;
}
h2 { font-size: 16px; }
h3 { font-size: 14px; }
h4 { font-size: 13px; }
.help { color: var(--sci-muted); font-size: 10.5px; margin-top: 2px; }
.input-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}
.field { display: flex; flex-direction: column; gap: 5px; }
label, .label {
  color: var(--sci-muted);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
}
input, select, textarea {
  width: 100%;
  min-height: 36px;
  border: 1px solid var(--sci-line);
  border-radius: 9px;
  background: #fff;
  color: var(--sci-ink);
  padding: 7px 9px;
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--sci-clay); box-shadow: 0 0 0 3px rgba(168,85,31,.12); }
.actions { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.btn {
  border: 0;
  border-radius: 9px;
  padding: 7px 11px;
  color: #fff;
  background: var(--sci-leaf-deep);
  cursor: pointer;
  font-weight: 800;
  font-size: 12px;
  white-space: nowrap;
}
.btn.secondary { background: var(--sci-clay); }
.btn.ghost { background: #fff; color: var(--sci-earth); border: 1px solid var(--sci-line); }
.btn.danger { background: #8D3B1F; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.compact-summary {
  padding: 6px 8px;
  margin-bottom: 8px;
  border-radius: 8px;
}
.compact-summary .card-title {
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.compact-summary h2 {
  font-size: 12px;
  line-height: 1;
  margin: 0;
}
.compact-summary .help { display: none; }
.summary-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(95px, 1fr));
  gap: 3px;
}
.metric, .stat {
  background: #FDFBF7;
  border: 1px solid var(--sci-line);
  border-radius: 5px;
  padding: 3px 5px;
}
.metric .label { font-size: 7px; line-height: 1.05; letter-spacing: .06em; margin-bottom: 1px; }
.metric .value, .stat .value {
  font-size: 10.5px;
  font-weight: 850;
  color: var(--sci-earth);
  letter-spacing: -.03em;
  line-height: 1.05;
}
.metric .small { display: none; }
.crop-mini-summary { display: none; }
.crop-mini-pill {
  border: 1px solid var(--sci-line);
  border-radius: 999px;
  padding: 4px 7px;
  background: #fff;
  color: var(--sci-earth);
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}
.note {
  border-left: 4px solid var(--sci-clay);
  background: var(--warn-bg);
  color: var(--sci-earth);
  padding: 8px 10px;
  border-radius: 9px;
  font-size: 12px;
  margin-bottom: 8px;
}
.crop-page-shell { padding: 10px; }
.crop-page-top {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.crop-tabs { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
.crop-tab {
  border: 1px solid var(--sci-line);
  background: #fff;
  color: var(--sci-earth);
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
  cursor: pointer;
}
.crop-tab.active { background: var(--sci-leaf-deep); border-color: var(--sci-leaf-deep); color: #fff; }
.crop-page-controls { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.crop-page-count { color: var(--sci-muted); font-size: 12px; font-weight: 800; }
.crop-card { display: none; padding: 12px; }
.crop-card.active-crop { display: block; }
.crop-head {
  display: grid;
  grid-template-columns: minmax(180px, 1.2fr) minmax(115px, .55fr) auto;
  gap: 9px;
  align-items: end;
  padding: 10px;
  margin: -12px -12px 9px;
  background: var(--sci-soft);
  border-bottom: 1px solid var(--sci-line);
  border-radius: 14px 14px 0 0;
}
.crop-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 9px; }
.stat .value { color: var(--sci-leaf-deep); }
.optional-bar {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  align-items: center;
  padding: 8px;
  border: 1px dashed var(--sci-line);
  background: #FDFBF7;
  border-radius: 11px;
  margin-bottom: 8px;
}
.optional-bar .help { margin: 0; flex: 1 1 220px; }
.optional-panel {
  border: 1px solid #EFE7D7;
  border-radius: 11px;
  overflow: hidden;
  margin-top: 8px;
}
.optional-panel-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  padding: 8px 9px;
  background: #F4EBD9;
  border-bottom: 1px solid var(--sci-line);
}
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1050px; }
th {
  text-align: left;
  color: var(--sci-earth);
  background: #F4EBD9;
  font-size: 9px;
  letter-spacing: .075em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--sci-line);
  padding: 6px;
  white-space: nowrap;
}
td { border-bottom: 1px solid #EFE7D7; padding: 5px; vertical-align: middle; background: #fff; }
tbody tr:nth-child(even) td { background: #FDFBF7; }
td input, td select { min-height: 31px; padding: 5px 7px; border-radius: 8px; }
.readonly { color: var(--sci-earth); font-weight: 800; white-space: nowrap; }
.hidden { display: none !important; }
@media (max-width: 920px) {
  .page { padding: 6px; }
  .card, .crop-card, .crop-page-shell { border-radius: 12px; padding: 9px; }
  .card-title, .section-title, .optional-toolbar { gap: 8px; margin-bottom: 8px; }
  .input-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .summary-grid, .crop-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .compact-summary .summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .crop-page-top { grid-template-columns: 1fr; }
  .crop-page-controls { width: 100%; justify-content: space-between; }
  .crop-head { grid-template-columns: 1fr; margin: -9px -9px 8px; padding: 9px; }
  .remove-crop { width: 100%; }
  .table-wrap { overflow: visible; }
  table, thead, tbody, tr, th, td { display: block; width: 100%; }
  table { min-width: 0; border-spacing: 0; }
  thead { display: none; }
  .ipm-row {
    border: 1px solid var(--sci-line);
    border-radius: 11px;
    background: #fff;
    padding: 8px;
    margin-bottom: 8px;
  }
  td { border-bottom: 0; padding: 5px 0; background: transparent !important; }
  td::before {
    content: attr(data-label);
    display: block;
    color: var(--sci-muted);
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  td.readonly { border: 1px solid #EFE7D7; border-radius: 9px; padding: 7px 9px; background: #FDFBF7 !important; }
  td:last-child::before { display: none; }
  .remove-ipm, .optional-panel-head .btn, .optional-bar .btn { width: 100%; }
  .optional-panel-head, .optional-bar { align-items: stretch; flex-direction: column; }
}
@media (max-width: 520px) {
  html, body { font-size: 12.5px; }
  .input-grid, .summary-grid, .crop-stats { grid-template-columns: 1fr; }
  .compact-summary .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card-title, .section-title { flex-direction: column; align-items: stretch; }
  .actions, .actions .btn { width: 100%; }
  .crop-mini-pill { width: 100%; text-align: center; }
}


/* Ultra-slim iframe summary strips */
.compact-summary {
  padding: 4px 6px !important;
  margin-bottom: 6px !important;
  border-radius: 6px !important;
}
.compact-summary .card-title { display: none !important; }
.compact-summary .summary-grid {
  display: grid !important;
  grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
  gap: 4px !important;
}
.compact-summary .metric,
.crop-stats .stat {
  min-height: 22px !important;
  padding: 4px 6px !important;
  border-radius: 6px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  gap: 6px !important;
  min-width: 0 !important;
  background: #FDFBF7 !important;
}
.compact-summary .metric .label,
.crop-stats .stat .label {
  margin: 0 !important;
  font-size: 8px !important;
  line-height: 1 !important;
  letter-spacing: .06em !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}
.compact-summary .metric .value,
.crop-stats .stat .value {
  font-size: 12px !important;
  line-height: 1 !important;
  margin: 0 !important;
  flex: 0 0 auto !important;
}
.crop-stats {
  grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
  gap: 4px !important;
  margin-bottom: 6px !important;
}
@media (max-width: 768px) {
  .compact-summary .summary-grid,
  .crop-stats { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .compact-summary .metric,
  .crop-stats .stat { min-height: 24px !important; }
}
@media (max-width: 420px) {
  .compact-summary .metric .label,
  .crop-stats .stat .label { font-size: 7px !important; }
  .compact-summary .metric .value,
  .crop-stats .stat .value { font-size: 11px !important; }
}



/* MAX-CLEAN IFRAME MODE: hide bulky calculated tiles/cards from entry view */
.crop-stats { display: none !important; }
.compact-summary {
  padding: 0 !important;
  margin: 0 0 5px 0 !important;
  border: 0 !important;
  background: transparent !important;
}
.compact-summary .summary-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
  gap: 3px !important;
}
.compact-summary .metric {
  min-height: 18px !important;
  height: 18px !important;
  padding: 2px 5px !important;
  border-radius: 4px !important;
  border-width: 1px !important;
  background: #fff !important;
}
.compact-summary .metric .label { font-size: 6.5px !important; letter-spacing: .05em !important; }
.compact-summary .metric .value { font-size: 10px !important; }
/* Hide calculated AI output columns in the working entry table. Values still calculate for CSV. */
table th:nth-child(7), table th:nth-child(8),
table td:nth-child(7), table td:nth-child(8) { display: none !important; }
@media (max-width: 1100px) {
  tr.ipm-row {
    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
    gap: 5px !important;
    padding: 6px !important;
    border-radius: 5px !important;
  }
  td { gap: 2px !important; }
  td::before { font-size: 7px !important; letter-spacing: .05em !important; }
  td input, td select, td textarea,
  input, select, textarea {
    min-height: 30px !important;
    height: 30px !important;
    padding: 4px 7px !important;
    font-size: 14px !important;
    border-radius: 6px !important;
  }
  td:last-child .btn { min-height: 30px !important; }
}
@media (max-width: 760px) {
  .compact-summary .summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
  tr.ipm-row { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
}
@media (max-width: 420px) {
  .compact-summary .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  tr.ipm-row { grid-template-columns: 1fr !important; }
}

</style>
</head>
<body>
<div class="page">
  <section class="card">
    <div class="card-title">
      <div><h2>Farm Details</h2><div class="help">Enter farm acres, choose crops, then add IPM applications only when needed.</div></div>
      <div class="actions"><button class="btn secondary" id="exportCsvBtn" type="button">Export CSV</button></div>
    </div>
    <div class="input-grid">
      <div class="field"><label for="farmName">Farm Name</label><input id="farmName" placeholder="Example: ABC Farm" /></div>
      <div class="field"><label for="state">State</label><select id="state"><option value="">Select state</option><option>Alabama</option><option>Alaska</option><option>Arizona</option><option>Arkansas</option><option>California</option><option>Colorado</option><option>Connecticut</option><option>Delaware</option><option>Florida</option><option>Georgia</option><option>Hawaii</option><option>Idaho</option><option>Illinois</option><option>Indiana</option><option>Iowa</option><option>Kansas</option><option>Kentucky</option><option>Louisiana</option><option>Maine</option><option>Maryland</option><option>Massachusetts</option><option>Michigan</option><option>Minnesota</option><option>Mississippi</option><option>Missouri</option><option>Montana</option><option>Nebraska</option><option>Nevada</option><option>New Hampshire</option><option>New Jersey</option><option>New Mexico</option><option>New York</option><option>North Carolina</option><option>North Dakota</option><option>Ohio</option><option>Oklahoma</option><option>Oregon</option><option>Pennsylvania</option><option>Rhode Island</option><option>South Carolina</option><option>South Dakota</option><option>Tennessee</option><option>Texas</option><option>Utah</option><option>Vermont</option><option>Virginia</option><option>Washington</option><option>West Virginia</option><option>Wisconsin</option><option>Wyoming</option></select></div>
      <div class="field"><label for="totalAcres">Total Acres</label><input id="totalAcres" type="number" min="0" step="0.01" placeholder="0" /></div>
      <div class="field"><label for="preparedBy">Prepared By</label><input id="preparedBy" placeholder="Optional" /></div>
      <div class="field"><label for="cropCount">Number of Crops</label><input id="cropCount" type="number" min="1" max="10" step="1" value="1" /></div>
    </div>
  </section>

  <section class="card compact-summary">
    <div class="card-title">
      <div><h2>Summary</h2><div class="help">Compact totals for iframe viewing.</div></div>
      <div class="actions"><button class="btn ghost" id="addCropBtn" type="button">Add Crop</button></div>
    </div>
    <div id="acreWarning" class="note hidden"></div>
    <div class="summary-grid">
      <div class="metric"><div class="label">Crop Acres</div><div class="value" id="sumCropAcres">0.00</div><div class="small">Entered</div></div>
      <div class="metric"><div class="label">Remaining</div><div class="value" id="remainingAcres">0.00</div><div class="small">Unassigned</div></div>
      <div class="metric"><div class="label">IPM Entries</div><div class="value" id="farmEntries">0</div><div class="small">All crops</div></div>
      <div class="metric"><div class="label">Total AI</div><div class="value" id="farmTotalAI">0.00</div><div class="small">Across acres</div></div>
    </div>
    <div class="crop-mini-summary" id="cropAITiles"></div>
  </section>

  <section class="crop-page-shell">
    <div class="crop-page-top">
      <div class="crop-tabs" id="cropTabs" aria-label="Crop pages"></div>
      <div class="crop-page-controls">
        <button class="btn ghost" id="prevCropBtn" type="button">Previous</button>
        <span class="crop-page-count" id="cropPageCount">Crop 1 of 1</span>
        <button class="btn ghost" id="nextCropBtn" type="button">Next</button>
      </div>
    </div>
    <main id="crops"></main>
  </section>
</div>

<template id="cropTemplate">
  <section class="crop-card" data-crop-id="">
    <div class="crop-head">
      <div class="field"><label>Crop Name</label><input class="crop-name" placeholder="Corn, soybeans, wheat..." /></div>
      <div class="field"><label>Crop Acres</label><input class="crop-acres" type="number" min="0" step="0.01" placeholder="0" /></div>
      <button class="btn danger remove-crop" type="button">Remove Crop</button>
    </div>
    <div class="crop-stats">
      <div class="stat"><div class="label">AI / Acre</div><div class="value crop-ai-acre">0.00</div></div>
      <div class="stat"><div class="label">Total AI</div><div class="value crop-ai-total">0.00</div></div>
      <div class="stat"><div class="label">IPM Entries</div><div class="value crop-products">0</div></div>
      <div class="stat"><div class="label">Crop Acres</div><div class="value crop-acres-stat">0.00</div></div>
    </div>

    <div class="optional-bar">
      <div class="help">Add IPM applications only when this crop has pesticide, herbicide, fungicide, or insecticide entries.</div>
      <button class="btn ghost add-ipm" type="button">Add IPM Entry</button>
    </div>

    <section class="optional-panel ipm-panel hidden">
      <div class="optional-panel-head">
        <div><h3>IPM Applications</h3><div class="help">Use the product label rate as Amount / Acre and active ingredient as a percentage.</div></div>
        <button class="btn ghost add-ipm-panel" type="button">Add Another Entry</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Application Date</th><th style="width:170px">Weed or Pest</th><th style="width:170px">Product Name</th><th>Unit</th><th>Amount / Acre</th><th>% Active Ingredient</th><th>AI / Acre</th><th>Total AI</th><th>Notes</th><th></th>
            </tr>
          </thead>
          <tbody class="ipm-body"></tbody>
        </table>
      </div>
    </section>
  </section>
</template>

<template id="ipmTemplate">
  <tr class="ipm-row">
    <td data-label="Application Date"><input class="application-date" type="date" /></td>
    <td data-label="Weed or Pest"><input class="pest" placeholder="Grass, broadleaf, insect..." /></td>
    <td data-label="Product Name"><input class="product-name" placeholder="Product name" /></td>
    <td data-label="Unit"><select class="product-unit"><option>Fluid oz</option><option>Pints</option><option>Quarts</option><option>Gallons</option><option>oz</option><option>lbs</option><option>Tons</option></select></td>
    <td data-label="Amount / Acre"><input class="amount-acre" type="number" min="0" step="0.001" placeholder="0" /></td>
    <td data-label="% Active Ingredient"><input class="active-pct" type="number" min="0" max="100" step="0.01" placeholder="0" /></td>
    <td data-label="Active Ingredient / Acre" class="readonly ai-acre">0.00</td>
    <td data-label="Total Active Ingredient" class="readonly ai-total">0.00</td>
    <td data-label="Notes"><input class="notes" placeholder="Optional" /></td>
    <td data-label="Remove"><button class="btn danger remove-ipm" type="button">Remove Entry</button></td>
  </tr>
</template>

<script>
const MAX_CROPS = 10;
let cropCounter = 0;
let activeCropIndex = 0;
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const num = v => Number.isFinite(parseFloat(v)) ? parseFloat(v) : 0;
const fmt = (n, d = 2) => Number.isFinite(n) ? n.toFixed(d) : (0).toFixed(d);

function getCropCards() { return $$('.crop-card'); }
function clampPct(value) { return Math.min(100, Math.max(0, num(value))); }
function clearRow(row) { $$('input, textarea', row).forEach(input => input.value = ''); $$('select', row).forEach(select => select.selectedIndex = 0); }

function updateOptionalPanels(crop) {
  if (!crop) return;
  const hasIpm = $$('.ipm-row', crop).length > 0;
  $('.ipm-panel', crop).classList.toggle('hidden', !hasIpm);
}

function createIpmRow() {
  const row = $('#ipmTemplate').content.firstElementChild.cloneNode(true);
  row.addEventListener('input', calculateAll);
  row.addEventListener('change', calculateAll);
  $('.remove-ipm', row).addEventListener('click', () => {
    const crop = row.closest('.crop-card');
    row.remove();
    updateOptionalPanels(crop);
    calculateAll();
  });
  return row;
}

function addIpmEntry(crop) {
  $('.ipm-body', crop).appendChild(createIpmRow());
  updateOptionalPanels(crop);
  calculateAll();
}

function setActiveCrop(index) {
  const crops = getCropCards();
  if (!crops.length) { activeCropIndex = 0; renderCropNavigation(); return; }
  activeCropIndex = Math.max(0, Math.min(index, crops.length - 1));
  crops.forEach((crop, i) => crop.classList.toggle('active-crop', i === activeCropIndex));
  renderCropNavigation();
}

function renderCropNavigation() {
  const crops = getCropCards();
  const tabs = $('#cropTabs');
  const pageCount = $('#cropPageCount');
  if (!tabs || !pageCount) return;
  tabs.innerHTML = '';
  crops.forEach((crop, index) => {
    const name = $('.crop-name', crop)?.value.trim() || `Crop ${index + 1}`;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `crop-tab${index === activeCropIndex ? ' active' : ''}`;
    btn.textContent = name;
    btn.addEventListener('click', () => setActiveCrop(index));
    tabs.appendChild(btn);
  });
  pageCount.textContent = crops.length ? `Crop ${activeCropIndex + 1} of ${crops.length}` : 'No crops';
  $('#prevCropBtn').disabled = activeCropIndex <= 0;
  $('#nextCropBtn').disabled = activeCropIndex >= crops.length - 1;
}

function desiredCropCount() {
  const input = $('#cropCount');
  let count = Math.round(num(input.value));
  if (!count || count < 1) count = 1;
  if (count > MAX_CROPS) count = MAX_CROPS;
  input.value = String(count);
  return count;
}

function syncCropCardsToCount() {
  const target = desiredCropCount();
  while ($$('.crop-card').length < target) addCrop(`Crop ${$$('.crop-card').length + 1}`, '');
  while ($$('.crop-card').length > target) {
    const all = $$('.crop-card');
    all[all.length - 1].remove();
  }
  setActiveCrop(Math.min(activeCropIndex, $$('.crop-card').length - 1));
  calculateAll();
}

function addCrop(name = '', acres = '') {
  if ($$('.crop-card').length >= MAX_CROPS) return;
  cropCounter++;
  const crop = $('#cropTemplate').content.firstElementChild.cloneNode(true);
  crop.dataset.cropId = String(cropCounter);
  $('.crop-name', crop).value = name;
  $('.crop-acres', crop).value = acres;
  $$('.add-ipm, .add-ipm-panel', crop).forEach(btn => btn.addEventListener('click', () => addIpmEntry(crop)));
  $('.remove-crop', crop).addEventListener('click', () => {
    const removedIndex = $$('.crop-card').indexOf(crop);
    crop.remove();
    $('#cropCount').value = String(Math.max(1, $$('.crop-card').length));
    activeCropIndex = Math.min(removedIndex, Math.max(0, $$('.crop-card').length - 1));
    setActiveCrop(activeCropIndex);
    calculateAll();
  });
  crop.addEventListener('input', calculateAll);
  crop.addEventListener('change', calculateAll);
  $('#crops').appendChild(crop);
  updateOptionalPanels(crop);
  setActiveCrop($$('.crop-card').length - 1);
  calculateAll();
}

function getIpmData(crop, row) {
  const cropName = $('.crop-name', crop).value.trim();
  const cropAcres = num($('.crop-acres', crop).value);
  const applicationDate = $('.application-date', row).value;
  const pest = $('.pest', row).value.trim();
  const productName = $('.product-name', row).value.trim();
  const productUnit = $('.product-unit', row).value;
  const amountPerAcre = num($('.amount-acre', row).value);
  const activePct = clampPct($('.active-pct', row).value);
  const activeIngredientPerAcre = amountPerAcre * (activePct / 100);
  const totalActiveIngredient = activeIngredientPerAcre * cropAcres;
  const notes = $('.notes', row).value.trim();
  const hasEntry = applicationDate || pest || productName || amountPerAcre > 0 || activePct > 0 || notes;
  return { cropName, cropAcres, applicationDate, pest, productName, productUnit, amountPerAcre, activePct, activeIngredientPerAcre, totalActiveIngredient, notes, hasEntry };
}

function calculateAll() {
  const totalAcres = num($('#totalAcres').value);
  let cropAcresTotal = 0;
  let farmTotalAI = 0;
  let farmEntries = 0;
  const cropTiles = [];

  $$('.crop-card').forEach((crop, idx) => {
    const cropName = $('.crop-name', crop).value.trim() || `Crop ${idx + 1}`;
    const cropAcres = num($('.crop-acres', crop).value);
    cropAcresTotal += cropAcres;
    let cropAIperAcre = 0;
    let cropAITotal = 0;
    let cropEntries = 0;

    $$('.ipm-row', crop).forEach(row => {
      const data = getIpmData(crop, row);
      $('.ai-acre', row).textContent = fmt(data.activeIngredientPerAcre, 4);
      $('.ai-total', row).textContent = fmt(data.totalActiveIngredient, 4);
      if (data.hasEntry) cropEntries++;
      cropAIperAcre += data.activeIngredientPerAcre;
      cropAITotal += data.totalActiveIngredient;
    });

    farmTotalAI += cropAITotal;
    farmEntries += cropEntries;
    $('.crop-ai-acre', crop).textContent = fmt(cropAIperAcre, 4);
    $('.crop-ai-total', crop).textContent = fmt(cropAITotal, 4);
    $('.crop-products', crop).textContent = String(cropEntries);
    $('.crop-acres-stat', crop).textContent = fmt(cropAcres, 2);
    cropTiles.push({ cropName, cropAITotal, cropEntries });
    updateOptionalPanels(crop);
  });

  const remaining = totalAcres - cropAcresTotal;
  $('#sumCropAcres').textContent = fmt(cropAcresTotal, 2);
  $('#remainingAcres').textContent = fmt(remaining, 2);
  $('#farmEntries').textContent = String(farmEntries);
  $('#farmTotalAI').textContent = fmt(farmTotalAI, 4);
  const warning = $('#acreWarning');
  if (totalAcres > 0 && Math.abs(remaining) > 0.01) {
    warning.textContent = remaining < 0 ? `Crop acres exceed total acres by ${fmt(Math.abs(remaining), 2)} acres.` : `${fmt(remaining, 2)} acres remain unassigned to crops.`;
    warning.classList.remove('hidden');
  } else warning.classList.add('hidden');
  const tileWrap = $('#cropAITiles');
  tileWrap.innerHTML = '';
  cropTiles.forEach(tile => {
    const el = document.createElement('div');
    el.className = 'crop-mini-pill';
    el.textContent = `${tile.cropName}: ${fmt(tile.cropAITotal, 2)} AI · ${tile.cropEntries} entries`;
    tileWrap.appendChild(el);
  });
  renderCropNavigation();
}

function csvEscape(value) {
  const str = String(value ?? '');
  return /[",\n]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
}

function exportCsv() {
  calculateAll();
  const farmName = $('#farmName').value.trim();
  const state = $('#state').value;
  const totalAcres = $('#totalAcres').value;
  const preparedBy = $('#preparedBy').value.trim();
  const rows = [['Farm Name','State','Total Farm Acres','Prepared By','Crop','Crop Acres','Application Date','Weed or Pest','Product Name','Unit','Amount per Acre','Percent Active Ingredient','Active Ingredient per Acre','Total Active Ingredient over Crop Acres','Notes']];
  $$('.crop-card').forEach((crop, idx) => {
    const cropName = $('.crop-name', crop).value.trim() || `Crop ${idx + 1}`;
    const cropAcres = num($('.crop-acres', crop).value);
    let addedRow = false;
    $$('.ipm-row', crop).forEach(row => {
      const data = getIpmData(crop, row);
      if (!data.hasEntry) return;
      rows.push([farmName, state, totalAcres, preparedBy, cropName, fmt(cropAcres, 2), data.applicationDate, data.pest, data.productName, data.productUnit, fmt(data.amountPerAcre, 3), fmt(data.activePct, 2), fmt(data.activeIngredientPerAcre, 4), fmt(data.totalActiveIngredient, 4), data.notes]);
      addedRow = true;
    });
    if (!addedRow && (cropName || cropAcres > 0)) rows.push([farmName, state, totalAcres, preparedBy, cropName, fmt(cropAcres, 2), '', '', '', '', '', '', '', '', '']);
  });
  const csv = rows.map(row => row.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (farmName || 'ipm_inputs').replace(/[^a-z0-9-_]+/gi, '_').replace(/^_+|_+$/g, '');
  a.href = url;
  a.download = `${safeName || 'ipm_inputs'}_ipm_inputs.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

$('#cropCount').addEventListener('change', syncCropCardsToCount);
$('#cropCount').addEventListener('input', syncCropCardsToCount);
$('#addCropBtn').addEventListener('click', () => {
  if ($$('.crop-card').length >= MAX_CROPS) return;
  const next = $$('.crop-card').length + 1;
  $('#cropCount').value = String(next);
  addCrop(`Crop ${next}`, '');
});
$('#prevCropBtn').addEventListener('click', () => setActiveCrop(activeCropIndex - 1));
$('#nextCropBtn').addEventListener('click', () => setActiveCrop(activeCropIndex + 1));
$('#exportCsvBtn').addEventListener('click', exportCsv);
['farmName', 'state', 'totalAcres', 'preparedBy'].forEach(id => {
  $(`#${id}`).addEventListener('input', calculateAll);
  $(`#${id}`).addEventListener('change', calculateAll);
});
syncCropCardsToCount();
</script>
</body>
</html>
